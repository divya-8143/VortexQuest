<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VortexQuest - 2D Engine & RPG</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0b0e14;
      color: #e6edf3;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    #game-canvas {
      border: 2px solid #30363d;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      background-color: #161b22;
    }
    #hud {
      margin-top: 15px;
      font-size: 14px;
      color: #8b949e;
    }
  </style>
</head>
<body>
  <canvas id="game-canvas" width="1280" height="720"></canvas>
  <div id="hud">VortexQuest Engine v1.0.0 | Built with TypeScript & Canvas 2D</div>
</body>
</html>
