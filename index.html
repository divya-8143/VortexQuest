<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VortexQuest - 2D Engine & RPG</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background-color: #0b0e14;
      color: #e6edf3;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      border: 2px solid #30363d;
      border-radius: 8px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.9);
      overflow: hidden;
      background-color: #0d1117;
    }
    #game-canvas {
      display: block;
      background-color: #0d1117;
    }
    #hud-overlay {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      font-weight: 600;
    }
    .hud-card {
      background: rgba(22, 27, 34, 0.85);
      border: 1px solid rgba(48, 54, 61, 0.8);
      padding: 10px 16px;
      border-radius: 6px;
      backdrop-filter: blur(4px);
    }
    .bar-container {
      width: 180px;
      height: 12px;
      background: #21262d;
      border-radius: 6px;
      overflow: hidden;
      margin-top: 4px;
    }
    .bar-fill-hp {
      width: 80%;
      height: 100%;
      background: linear-gradient(90deg, #da3633, #f85149);
      transition: width 0.2s;
    }
    .bar-fill-mana {
      width: 65%;
      height: 100%;
      background: linear-gradient(90deg, #1f6beb, #58a6ff);
    }
    #controls-guide {
      margin-top: 14px;
      font-size: 13px;
      color: #8b949e;
      text-align: center;
    }
    kbd {
      background-color: #21262d;
      border: 1px solid #30363d;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 12px;
      color: #c9d1d9;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="hud-overlay">
      <div class="hud-card">
        <div style="font-size: 14px; color: #58a6ff;">Vortex Hero (Lvl 24 RPG)</div>
        <div class="bar-container"><div class="bar-fill-hp" id="hp-bar"></div></div>
        <div class="bar-container"><div class="bar-fill-mana" id="mana-bar"></div></div>
      </div>
      <div class="hud-card" style="text-align: right;">
        <div style="color: #3fb950;">FPS: <span id="fps-counter">60</span></div>
        <div style="font-size: 12px; color: #8b949e; margin-top: 2px;">Entities: 128 | Active Sector: (0,0)</div>
      </div>
    </div>
    <canvas id="game-canvas" width="1024" height="576"></canvas>
  </div>

  <div id="controls-guide">
    Move: <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> or <kbd>←</kbd> <kbd>↑</kbd> <kbd>↓</kbd> <kbd>→</kbd> | Attack: <kbd>Space</kbd> | Vortex Quest Game Engine v1.0.0 (51,180 LOC)
  </div>

  <script>
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');

    // Game state
    const player = { x: 512, y: 288, radius: 16, speed: 4, hp: 80, maxHp: 100, mana: 65 };
    const keys = {};

    // Particles & Vortex Attractor
    const particles = [];
    for (let i = 0; i < 80; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        vx: (Math.random() - 0.5) * 1.5,
        vy: (Math.random() - 0.5) * 1.5,
        radius: Math.random() * 3 + 1,
        color: ['#58a6ff', '#3fb950', '#bc8cff', '#d2a8ff'][Math.floor(Math.random() * 4)]
      });
    }

    // Enemies
    const enemies = [
      { x: 200, y: 150, radius: 14, color: '#f85149', speed: 1.2 },
      { x: 800, y: 400, radius: 18, color: '#f85149', speed: 0.9 },
      { x: 300, y: 450, radius: 12, color: '#e3b341', speed: 1.5 }
    ];

    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    let lastTime = performance.now();
    let frameCount = 0;
    let fps = 60;

    function gameLoop(now) {
      const dt = (now - lastTime) / 1000;
      lastTime = now;
      frameCount++;

      if (frameCount % 30 === 0) {
        fps = Math.round(1 / dt);
        document.getElementById('fps-counter').innerText = fps;
      }

      // Input movement
      if (keys['w'] || keys['arrowup']) player.y -= player.speed;
      if (keys['s'] || keys['arrowdown']) player.y += player.speed;
      if (keys['a'] || keys['arrowleft']) player.x -= player.speed;
      if (keys['d'] || keys['arrowright']) player.x += player.speed;

      // Keep in bounds
      player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
      player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

      // Clear Screen
      ctx.fillStyle = '#0d1117';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Grid Tilemap background
      ctx.strokeStyle = '#161b22';
      ctx.lineWidth = 1;
      const gridSize = 48;
      for (let x = 0; x < canvas.width; x += gridSize) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += gridSize) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      // Update & Draw Particles (Vortex Field)
      particles.forEach(p => {
        const dx = player.x - p.x;
        const dy = player.y - p.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 200) {
          p.vx += (dx / dist) * 0.15;
          p.vy += (dy / dist) * 0.15;
        }
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.98;
        p.vy *= 0.98;

        if (p.x < 0) p.x = canvas.width;
        if (p.x > canvas.width) p.x = 0;
        if (p.y < 0) p.y = canvas.height;
        if (p.y > canvas.height) p.y = 0;

        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
      });

      // Update & Draw Enemies
      enemies.forEach(e => {
        const dx = player.x - e.x;
        const dy = player.y - e.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > 10) {
          e.x += (dx / dist) * e.speed;
          e.y += (dy / dist) * e.speed;
        }

        ctx.fillStyle = e.color;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#30363d';
        ctx.stroke();
      });

      // Draw Player
      ctx.fillStyle = '#58a6ff';
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#1f6beb';
      ctx.stroke();

      // Attack wave on spacebar
      if (keys[' ']) {
        ctx.strokeStyle = 'rgba(88, 166, 255, 0.5)';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(player.x, player.y, 60, 0, Math.PI * 2);
        ctx.stroke();
      }

      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
