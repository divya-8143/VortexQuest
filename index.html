<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VortexQuest - 2D Action RPG</title>
  <!-- Google Fantasy Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body {
      width: 100vw;
      height: 100vh;
      background-color: #05070a;
      color: #e6edf3;
      font-family: 'Rajdhani', system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at center, #0d131f 0%, #05070a 100%);
    }
    #game-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background-color: transparent;
    }

    /* Fantasy RPG UI Styles */
    .rpg-card {
      background: rgba(15, 20, 30, 0.92) !important;
      backdrop-filter: blur(10px);
      border: 2px solid #c9a050 !important;
      border-radius: 8px !important;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8), inset 0 0 10px rgba(201, 160, 80, 0.15);
    }
    .rpg-header {
      font-family: 'Cinzel', serif;
      letter-spacing: 1px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
    .rpg-btn {
      font-family: 'Cinzel', serif;
      background: linear-gradient(180deg, #2a3547 0%, #161e2b 100%);
      border: 1.5px solid #c9a050;
      color: #f0e6d2;
      transition: all 0.15s ease-in-out;
      text-shadow: 0 1px 2px #000;
    }
    .rpg-btn:hover {
      background: linear-gradient(180deg, #3b4b66 0%, #202b3d 100%);
      border-color: #ffd700;
      color: #ffffff;
      box-shadow: 0 0 14px rgba(255, 215, 0, 0.4);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="game-canvas"></canvas>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
